<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Wizard Spell</title>
<!--
  Remake of prompts/zacxbt-944604.md:
  "single self-contained HTML file, animated pixel art wizard casting a spell, vanilla JS + Canvas 2D,
   128x96 logical canvas blitted at an integer scale, fixed 24-color palette, IDLE -> CHARGE -> CAST -> RECOVER,
   pooled particles, fixed 60Hz timestep, seamless loop."
  Reference (Skillry remake, Canvas · Pixel art): took the four-state loop and the orbit-then-burst sparks.
  Did not take its sprite sheet or palette (everything here is rects from the palette below). Do not copy.
  Zero dependencies. The simulation between SIM-BEGIN/SIM-END is deterministic (integer steps + seeded xorshift),
  so a frame is a pure function of the step count: ?t=<sec> freezes the clock for screenshots, and
  remakes/sim_wizard.js runs the same block in Node to prove the loop seam:  node remakes/sim_wizard.js remakes/zacxbt-944604.html
-->
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
</style>
</head>
<body>
<canvas id="d"></canvas>
<script>
'use strict';
const LW=128,LH=96,HZ=60,LOOP=6,STEPS=LOOP*HZ;
const PAL=['#0a0a1e','#141433','#1f1f4a','#2b2b5e','#3a3a78','#54548f', // 0-5 sky / purples
 '#2a2a2a','#4a4a52','#6c6c74','#e8e4c8','#f6f0a0',                    // 6-10 floor, moon, star
 '#5a2a6a','#8a3f9a','#b365c4','#2e1538','#f0c8a0','#d0d0d8','#ffffff', // 11-17 robe, outline, skin, beard
 '#6a4420','#9a6a38','#48ffd8','#20c0ff','#ff70f0','#ffffc0'];          // 18-23 staff, magic
const FADE=[17,23,20,21,4,3]; // particle palette walk: white -> magic -> dark

//SIM-BEGIN
const DUR=[144,96,48,72]; // IDLE, CHARGE, CAST, RECOVER in 1/60 steps (sum = STEPS)
const POSE=[[10,0,0,0],[-30,1,-1,-1],[70,.6,1,1],[10,0,0,0]]; // target at end of each state: staff deg, arm, head, sway
const NP=112,P=new Array(NP);
for(let i=0;i<NP;i++)P[i]={on:0,kind:0,x:0,y:0,vx:0,vy:0,life:0,max:1};
const S={step:0,state:0,st:0,seed:1,shake:0,shx:0,shy:0,staff:0,arm:0,head:0,sway:0,
 handX:0,handY:0,gemX:0,gemY:0,botX:0,botY:0,rim:0,boltOn:0,boltX:0,boltY:0,alive:0};
function rnd(){let x=S.seed;x^=x<<13;x^=x>>>17;x^=x<<5;S.seed=x>>>0;return S.seed/4294967296}
function lerp(a,b,k){return a+(b-a)*k}
function ease(k){return k<.5?2*k*k:1-(-2*k+2)*(-2*k+2)/2}
function pose(){ // pose params + hand/staff geometry for the current state time (feet at 56,84; staff held one third up)
 const s=S.state,k=S.st/DUR[s],e=ease(k),pv=POSE[(s+3)&3],tg=POSE[s];
 S.staff=lerp(pv[0],tg[0],e);S.arm=lerp(pv[1],tg[1],e);S.head=lerp(pv[2],tg[2],e);S.sway=lerp(pv[3],tg[3],e);
 S.handX=64+Math.round(S.arm*2);S.handY=66-Math.round(S.arm*10);
 const a=S.staff*Math.PI/180,dx=Math.sin(a),dy=-Math.cos(a);
 S.gemX=Math.round(S.handX+dx*14);S.gemY=Math.round(S.handY+dy*14);
 S.botX=Math.round(S.handX-dx*8);S.botY=Math.round(S.handY-dy*8);
 S.rim=s===0?.15:s===1?lerp(.15,.8,k):s===2?lerp(1,.5,k):lerp(.5,.15,k);
}
function reset(){S.step=0;S.state=0;S.st=0;S.seed=0x9E3779B9;S.shake=0;S.shx=0;S.shy=0;S.boltOn=0;S.alive=0;for(let i=0;i<NP;i++)P[i].on=0;pose()}
function spawn(kind,x,y,vx,vy,max){for(let i=0;i<NP;i++){const p=P[i];if(!p.on){p.on=1;p.kind=kind;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=0;p.max=max;return}}}
function tick(){
 const dt=1/HZ,s=S.state;pose();
 if(s===1&&(S.st&1)===0){const an=rnd()*6.2832;spawn(1,0,0,an,12,.9)}      // orbit spark: vx=angle, vy=radius
 if(s===2&&S.st===0){
  for(let i=0;i<NP;i++){const p=P[i];if(p.on&&p.kind===1){p.kind=0;const c=Math.cos(p.vx),sn=Math.sin(p.vx);p.x=S.gemX+c*p.vy;p.y=S.gemY+sn*p.vy;p.vx=c*50;p.vy=sn*50;p.life=0;p.max=.8}}
  for(let i=0;i<48;i++){const an=rnd()*6.2832,sp=30+rnd()*40;spawn(0,S.gemX,S.gemY,Math.cos(an)*sp,Math.sin(an)*sp,.5+rnd()*.5)}
  S.boltOn=1;S.boltX=S.gemX;S.boltY=S.gemY;S.shake=2;
 }
 if(S.boltOn){S.boltX+=170*dt;spawn(0,S.boltX-3,S.boltY,-20*rnd(),(rnd()-.5)*20,.4);if(S.boltX>LW+6)S.boltOn=0}
 if(s===3)S.boltOn=0;
 let alive=0;
 for(let i=0;i<NP;i++){const p=P[i];if(!p.on)continue;p.life+=dt;
  if(p.kind===1){p.vx+=6*dt;p.vy-=11*dt;p.x=S.gemX+Math.cos(p.vx)*p.vy;p.y=S.gemY+Math.sin(p.vx)*p.vy;if(p.vy<1)p.on=0}
  else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=20*dt}
  if(p.life>=p.max)p.on=0;if(p.on)alive++}
 S.alive=alive;
 S.shake=Math.max(0,S.shake-6*dt);const sh=Math.round(S.shake);
 S.shx=sh?(S.step&1?sh:-sh):0;S.shy=sh?(S.step&2?1:-1):0;
 S.st++;if(S.st>=DUR[s]){S.state=(s+1)&3;S.st=0}
 S.step++;
}
//SIM-END

const dc=document.getElementById('d'),dctx=dc.getContext('2d');
const off=document.createElement('canvas');off.width=LW;off.height=LH;const g=off.getContext('2d');
function px(x,y,w,h,c){g.fillStyle=PAL[c];g.fillRect(x|0,y|0,w|0,h|0)}
function line(x0,y0,x1,y1,c){let dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,er=dx+dy;
 for(;;){px(x0,y0,1,1,c);if(x0===x1&&y0===y1)break;const e2=2*er;if(e2>=dy){er+=dy;x0+=sx}if(e2<=dx){er+=dx;y0+=sy}}}
const STARS=[];{let sd=7;const nx=()=>(sd=(Math.imul(sd,1103515245)+12345)>>>0)>>>8;for(let i=0;i<22;i++){const x=nx()%LW;STARS.push(x,nx()%60,nx()%40)}}

function scene(){
 px(0,0,LW,24,0);px(0,24,LW,32,1);px(0,56,LW,28,2);
 for(let i=0;i<STARS.length;i+=3){const tw=((S.step/15|0)+STARS[i+2])&3;px(STARS[i],STARS[i+1],1,1,tw===0?10:tw===2?3:9)}
 for(let dy=-7;dy<=7;dy++){const w=Math.round(Math.sqrt(49-dy*dy));px(104-w,16+dy,2*w,1,9)}
 for(let dy=-7;dy<=7;dy++){const w=Math.round(Math.sqrt(49-dy*dy));px(107-w,15+dy,2*w,1,0)} // crescent cut in the top sky band color
 px(0,84,LW,1,8);px(0,85,LW,11,6);
 for(let y=85;y<96;y+=4)for(let x=((y>>2)&1)*4;x<LW;x+=8)px(x,y,7,3,7);
}
function wizard(){
 const bob=(S.state===0||S.state===3)&&((S.st/20|0)&1)?1:0,oy=84-bob,ox=56;
 const sway=Math.round(S.sway),head=Math.round(S.head);
 const rimC=S.rim>.8?23:S.rim>.45?20:13;
 for(let r=0;r<22;r++){const y=oy-1-r,w=18-Math.round(r*8/21),sh=r<8?Math.round(sway*(8-r)/8):0,x=ox-(w>>1)+sh;
  px(x,y,1,1,14);px(x+1,y,(w>>1)-1,1,11);px(x+(w>>1),y,w-(w>>1)-1,1,12);px(x+w-1,y,1,1,14);if(S.rim>.2)px(x+w,y,1,1,rimC)}
 px(ox-5,oy-14,10,1,14);
 // arm and sleeve toward the hand
 line(ox+4,oy-20,S.handX,S.handY,12);line(ox+4,oy-21,S.handX,S.handY-1,13);
 const hx=ox+head,hy=oy-30;
 px(hx-4,hy,8,7,15);px(hx+1,hy+2,1,1,14);px(hx+3,hy+2,1,1,14);
 const bs=(S.state===0&&((S.st/30|0)&1))?1:0;
 px(hx-4,hy+5,9,3,16);px(hx-3,hy+8,8,3,16);px(hx-2+bs,hy+11,6,3,16);px(hx-1+bs,hy+14,3,2,16);px(hx-1,hy+6,2,6,17);
 px(hx-7,hy-1,15,2,11);px(hx-6,hy-1,13,1,12);
 for(let r=0;r<12;r++){const y=hy-2-r,w=12-r,bend=r>7?r-7:0,x=hx-(w>>1)+bend+1;px(x,y,w,1,11);if(w>2)px(x+1,y,w-2,1,r&1?12:13);if(S.rim>.45)px(x+w,y,1,1,rimC)}
 // staff from bottom to gem, hand on top
 line(S.botX,S.botY,S.gemX,S.gemY,18);line(S.botX+1,S.botY,S.gemX+1,S.gemY,19);
 px(S.handX-1,S.handY-1,3,3,15);
 const gc=S.state===1&&(S.step&2)?22:20;
 px(S.gemX-1,S.gemY,3,1,gc);px(S.gemX,S.gemY-1,1,3,gc);px(S.gemX,S.gemY,1,1,S.state===2?17:23);
}
function fx(){
 for(let i=0;i<NP;i++){const p=P[i];if(!p.on)continue;px(Math.round(p.x),Math.round(p.y),1,1,FADE[Math.min(5,p.life/p.max*6|0)])}
 if(S.boltOn){const bx=Math.round(S.boltX),by=S.boltY;px(bx-2,by-1,5,3,20);px(bx-1,by,4,1,23);px(bx-4,by,2,1,21)}
}
let scale=1,bx0=0,by0=0;
function size(){dc.width=innerWidth;dc.height=innerHeight;scale=Math.max(1,Math.floor(Math.min(innerWidth/LW,innerHeight/LH)));
 bx0=(innerWidth-LW*scale)>>1;by0=(innerHeight-LH*scale)>>1}
function draw(){
 g.setTransform(1,0,0,1,S.shx,S.shy);px(-2,-2,LW+4,LH+4,0);scene();wizard();fx();
 dctx.imageSmoothingEnabled=false;dctx.fillStyle='#000';dctx.fillRect(0,0,dc.width,dc.height);
 dctx.drawImage(off,bx0,by0,LW*scale,LH*scale);
}
const q=new URLSearchParams(location.search);
const FROZEN=q.has('t')||matchMedia('(prefers-reduced-motion: reduce)').matches;
reset();size();
if(FROZEN){const n=Math.round((q.has('t')?+q.get('t'):3.9)*HZ)%STEPS;for(let i=0;i<n;i++)tick();draw();}
else{let acc=0,last=0;
 const frame=now=>{if(!last)last=now;acc+=Math.min(.1,(now-last)/1000);last=now;
  while(acc>=1/HZ){tick();if(S.step>=STEPS)reset();acc-=1/HZ}
  draw();requestAnimationFrame(frame)};
 requestAnimationFrame(frame);}
addEventListener('resize',()=>{size();draw()});
</script>
</body>
</html>
